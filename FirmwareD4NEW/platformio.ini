; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Src

[env:stm32]
platform = ststm32
board = genericSTM32F411CE
platform_packages =
    toolchain-gccarmnoneeabi@1.140201.0 # override default gcc package with more recent version (v14)
    # this allows the linker script below to compile correctly

board_build.ldscript = Src/cubemx_autogen/ldscripts/STM32F411CEUX_FLASH.ld
board_build.stm32cube.startup_file = Src/Startup/startup_stm32f411ceux.s

upload_protocol = dfu
debug_tool = stlink

build_flags = 
    -ISrc/cubemx_autogen/Drivers/CMSIS/Include
    -ISrc/cubemx_autogen/Drivers/CMSIS/Device/ST/STM32F4xx/Include
    -ISrc/cubemx_autogen/Drivers/STM32F4xx_HAL_Driver/Inc	
    -ISrc/cubemx_autogen/Inc
    -ISrc/cubemx_autogen/Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
    -ISrc/cubemx_autogen/Middlewares/ST/STM32_USB_Device_Library/Core/Inc
    -Wl,-u,_printf_float


debug_build_flags = 
    -g
    -DDEBUG

extra_scripts = pre:scripts/format_cubemx.py
